<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>后厨看板 · 老张家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fdfaf7;
            padding: 12px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 3px solid #c0392b;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 22px;
            color: #f1c40f;
            letter-spacing: 2px;
        }
        .header .time {
            font-size: 18px;
            color: #aaa;
            font-weight: 500;
        }
        .header .badge {
            background: #c0392b;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .header .badge.show {
            display: inline-block;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .stats .stat-item {
            background: #2a2a2a;
            padding: 6px 16px;
            border-radius: 40px;
            border-left: 3px solid #c0392b;
            flex: 1;
            text-align: center;
            min-width: 70px;
        }
        .stats .stat-item strong {
            color: #f1c40f;
            font-size: 18px;
        }
        .stats .stat-item.green {
            border-left-color: #27ae60;
        }
        .stats .stat-item.green strong {
            color: #2ecc71;
        }
        .stats .stat-item.gold {
            border-left-color: #f39c12;
        }
        .stats .stat-item.gold strong {
            color: #f39c12;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .order-card {
            background: #252525;
            border-radius: 16px;
            padding: 16px 18px;
            border-left: 5px solid #f39c12;
            transition: 0.2s;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .order-card.done {
            opacity: 0.5;
            border-left-color: #27ae60;
            order: 999;
        }
        .order-card.done .card-title {
            text-decoration: line-through;
        }
        .order-card.flash {
            animation: flashBg 0.8s ease 2;
        }
        @keyframes flashBg {
            0% { background: #f1c40f; color: #000; }
            50% { background: #f1c40f; color: #000; }
            100% { background: #252525; color: #fdfaf7; }
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .card-title .table-tag {
            background: #c0392b;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .card-title .order-id {
            font-size: 12px;
            color: #888;
            font-weight: 400;
        }

        .card-items {
            font-size: 18px;
            font-weight: 500;
            padding: 6px 0 10px 0;
            color: #ecf0f1;
            line-height: 1.6;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 4px;
        }
        .card-footer .price {
            color: #2ecc71;
            font-size: 20px;
            font-weight: 700;
        }
        .card-footer .btn-group {
            display: flex;
            gap: 8px;
        }
        .card-footer .btn-group button {
            padding: 6px 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.1s;
        }
        .card-footer .btn-group button:active {
            transform: scale(0.94);
        }
        .btn-done {
            background: #27ae60;
            color: white;
        }
        .btn-done:active {
            background: #1e8449;
        }
        .btn-delete {
            background: #555;
            color: #ddd;
            font-size: 12px !important;
            padding: 6px 12px !important;
        }
        .btn-delete:active {
            background: #444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state .text {
            font-size: 18px;
        }
        .empty-state .sub {
            font-size: 14px;
            color: #444;
            margin-top: 4px;
        }

        .refresh-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            padding: 8px 0;
        }
        .refresh-bar button {
            background: #333;
            border: none;
            color: #aaa;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
        }
        .refresh-bar button:active {
            background: #444;
        }
        .refresh-bar .new-order-hint {
            color: #f1c40f;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .refresh-bar .new-order-hint.show {
            display: inline;
            animation: pulse 1s infinite;
        }

        .sound-toggle {
            background: #333;
            border: none;
            color: #aaa;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
        }
        .sound-toggle.on {
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        @media (max-width: 420px) {
            body { padding: 8px; }
            .header h1 { font-size: 18px; }
            .header .time { font-size: 14px; }
            .stats .stat-item { font-size: 12px; padding: 4px 10px; min-width: 60px; }
            .stats .stat-item strong { font-size: 15px; }
            .card-items { font-size: 16px; }
            .card-footer .price { font-size: 17px; }
            .card-footer .btn-group button { font-size: 12px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🥟 后厨看板</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <span class="time" id="clockDisplay">--:--</span>
            <span class="badge" id="newBadge">🔔 新</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">📦 待做 <br><strong id="pendingCount">0</strong></div>
        <div class="stat-item green">✅ 完成 <br><strong id="doneCount">0</strong></div>
        <div class="stat-item gold">💰 今日 <br><strong id="todayIncome">¥0</strong></div>
    </div>

    <div class="refresh-bar">
        <button onclick="fetchOrders()">🔄 刷新</button>
        <span class="new-order-hint" id="newOrderHint">🔔 有新订单！</span>
        <button class="sound-toggle on" id="soundToggle" onclick="toggleSound()">🔊 声音</button>
    </div>

    <div class="order-list" id="orderContainer">
        <div class="empty-state">
            <div class="icon">📭</div>
            <div class="text">暂无订单</div>
            <div class="sub">等待顾客扫码点单...</div>
        </div>
    </div>

    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://lmwcvvrrzfilfqectvpl.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_t8ieA51rEM-bdCqS-9pTTA_qi_BepvN';

        // ============================================================
        // 状态
        // ============================================================
        let orders = [];
        let audioCtx = null;
        let soundEnabled = true;
        let lastOrderCount = 0;

        // ============================================================
        // 声音
        // ============================================================
        function playBeep() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.value = 0.2;
                osc.start();
                setTimeout(() => { osc.stop(); }, 200);
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = 1100;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.15;
                    osc2.start();
                    setTimeout(() => { osc2.stop(); }, 150);
                }, 250);
            } catch (e) { console.log('声音播放失败'); }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            if (soundEnabled) {
                btn.textContent = '🔊 声音';
                btn.classList.add('on');
                showToast('声音已开启');
            } else {
                btn.textContent = '🔇 静音';
                btn.classList.remove('on');
                showToast('声音已关闭');
            }
        }

        // ============================================================
        // Toast
        // ============================================================
        let toastTimer = null;

        function showToast(msg) {
            let el = document.getElementById('toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast';
                el.style.cssText = `
                    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
                    background:#4a3328;color:#fdfaf7;padding:8px 24px;border-radius:60px;
                    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.3);
                    opacity:0;transition:opacity 0.3s;z-index:9999;
                    max-width:90%;text-align:center;
                `;
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1500);
        }

        // ============================================================
        // 获取订单
        // ============================================================
        async function fetchOrders() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=create_time.desc`, {
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
                    }
                });
                if (!response.ok) throw new Error('获取订单失败');
                const newOrders = await response.json();

                if (newOrders.length > lastOrderCount && lastOrderCount > 0) {
                    const newCount = newOrders.length - lastOrderCount;
                    const hint = document.getElementById('newOrderHint');
                    hint.textContent = `🔔 有 ${newCount} 个新订单！`;
                    hint.classList.add('show');
                    playBeep();
                    setTimeout(() => {
                        hint.classList.remove('show');
                    }, 4000);
                }

                orders = newOrders;
                lastOrderCount = orders.length;
                renderOrders();
            } catch (error) {
                console.error('获取订单失败：', error);
            }
        }

        // ============================================================
        // 渲染订单
        // ============================================================
        function renderOrders() {
            const container = document.getElementById('orderContainer');
            // 待制作：status 不是 "已完成"
            const pending = orders.filter(o => o.status !== '已完成');
            const done = orders.filter(o => o.status === '已完成');

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('doneCount').textContent = done.length;

            const totalIncome = done.reduce((sum, o) => sum + (o.total || 0), 0);
            document.getElementById('todayIncome').textContent = '¥' + totalIncome.toFixed(0);

            const badge = document.getElementById('newBadge');
            if (pending.length > 0) {
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <div class="text">暂无订单</div>
                        <div class="sub">等待顾客扫码点单...</div>
                    </div>
                `;
                return;
            }

            let html = '';
            // 先显示待制作，再显示已完成
            const sorted = [...pending, ...done];
            sorted.forEach((order, index) => {
                const isDone = order.status === '已完成';
                const modeIcon = order.mode === 'pack' ? '📦打包' : '🏠' + (order.table_number || '??') + '号桌';
                const itemsText = order.items || '菜品';

                const isNew = !isDone && index < 3;

                html += `
                    <div class="order-card ${isDone ? 'done' : ''} ${isNew ? 'flash' : ''}" data-id="${order.id}">
                        <div class="card-title">
                            <span>
                                <span class="table-tag">${modeIcon}</span>
                            </span>
                            <span class="order-id">#${order.id ? String(order.id).slice(-4) : '----'}</span>
                        </div>
                        <div class="card-items">${itemsText}</div>
                        <div class="card-footer">
                            <span class="price">¥${order.total || 0}</span>
                            <div class="btn-group">
                                ${!isDone ? `<button class="btn-done" onclick="markDone('${order.id}')">✅ 出餐</button>` : `<span style="color:#27ae60;font-size:13px;">✅ 已出餐</span>`}
                                <button class="btn-delete" onclick="deleteOrder('${order.id}')">✕</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============================================================
        // ⭐ 修复：出餐完成（只改 status，不改 paid）
        // ============================================================
        async function markDone(orderId) {
            if (!confirm('确认这份订单已出餐？')) return;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: '已完成' })
                });
                if (!response.ok) throw new Error('更新订单失败');
                playBeep();
                showToast('✅ 已出餐');
                fetchOrders();
            } catch (error) {
                alert('操作失败：' + error.message);
            }
        }

        // ============================================================
        // 删除订单
        // ============================================================
        async function deleteOrder(orderId) {
            if (!confirm('确定删除此订单吗？（仅用于误操作）')) return;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
                    }
                });
                if (!response.ok) throw new Error('删除订单失败');
                showToast('已删除');
                fetchOrders();
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        // ============================================================
        // 自动刷新
        // ============================================================
        setInterval(() => {
            fetchOrders();
        }, 5000);

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                fetchOrders();
            }
        });

        // ============================================================
        // 时钟
        // ============================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        // 初始化
        // ============================================================
        fetchOrders();
        console.log('🍳 后厨看板已启动');
        console.log('✅ 出餐完成只改状态，不影响收款标记');
    </script>

</body>
</html>
