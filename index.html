<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>家常小炒 · 扫码点单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #f7f7f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .app-container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 32px 32px 24px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      position: relative;
      padding-bottom: 100px;
    }
    .header {
      padding: 20px 20px 12px 20px;
      background: white;
      border-bottom: 1px solid #f0f0f2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1e1e2a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header h1 span {
      background: #e85d3a;
      color: white;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 40px;
      margin-left: 6px;
    }
    .table-badge {
      background: #f0f0f2;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #1e1e2a;
    }
    .table-badge i {
      font-style: normal;
      background: #e85d3a;
      color: white;
      padding: 0 8px;
      border-radius: 30px;
      margin-left: 6px;
    }
    .category-tabs {
      display: flex;
      gap: 10px;
      padding: 16px 20px 8px 20px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: white;
      border-bottom: 1px solid #f0f0f2;
    }
    .category-tabs::-webkit-scrollbar {
      display: none;
    }
    .category-tab {
      background: #f2f2f5;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #4a4a5a;
      cursor: default;
      flex-shrink: 0;
    }
    .category-tab.active {
      background: #1e1e2a;
      color: white;
    }
    .category-tab.highlight {
      background: #e85d3a;
      color: white;
    }
    .menu-list {
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu-item {
      background: white;
      border-radius: 16px;
      padding: 14px 14px 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #f0f0f2;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-weight: 600;
      font-size: 16px;
      color: #1e1e2a;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .item-name .badge {
      font-size: 10px;
      background: #e85d3a;
      color: white;
      border-radius: 30px;
      padding: 0 8px;
      line-height: 18px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .item-desc {
      font-size: 12px;
      color: #8e8e9e;
    }
    .item-price {
      font-weight: 600;
      color: #e85d3a;
      font-size: 17px;
      margin-top: 2px;
    }
    .item-price small {
      font-weight: 400;
      font-size: 12px;
      color: #8e8e9e;
      margin-left: 2px;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .qty-btn {
      background: #f2f2f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 300;
      color: #1e1e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .qty-btn.add {
      background: #e85d3a;
      color: white;
      font-weight: 500;
    }
    .qty-btn.add:active {
      background: #cc4f2e;
    }
    .qty-number {
      min-width: 24px;
      text-align: center;
      font-weight: 500;
      font-size: 16px;
      color: #1e1e2a;
    }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 12px 16px 20px 16px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(255,255,255,0.92) 60%, transparent);
    }
    .cart-inner {
      max-width: 420px;
      width: 100%;
      background: #1e1e2a;
      border-radius: 60px;
      padding: 12px 20px 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      pointer-events: auto;
    }
    .cart-info {
      display: flex;
      align-items: baseline;
      gap: 12px;
      color: white;
    }
    .cart-total {
      font-weight: 600;
      font-size: 20px;
    }
    .cart-count {
      background: #e85d3a;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
    }
    .cart-checkout {
      background: #e85d3a;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 8px 22px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(232, 93, 58, 0.35);
    }
    .cart-checkout:active {
      transform: scale(0.94);
      background: #cc4f2e;
    }
    .mock-table-info {
      padding: 6px 20px 8px 20px;
      background: #fafafc;
      font-size: 13px;
      color: #6e6e80;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f2;
    }
    .mock-table-info strong {
      color: #1e1e2a;
    }
    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e2a;
      color: white;
      padding: 8px 24px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #1e1e2a;
      padding: 8px 4px 4px 4px;
      border-bottom: 2px solid #e85d3a;
      margin-top: 4px;
    }
    @media (max-width: 480px) {
      .app-container {
        border-radius: 24px;
      }
      .cart-inner {
        padding: 10px 16px 10px 18px;
      }
      .cart-checkout {
        padding: 6px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast">已加入购物车</div>

  <div class="app-container">
    <div class="header">
      <h1>🍜 家常小炒<span>扫码</span></h1>
      <div class="table-badge">🪑 <i>A06</i></div>
    </div>

    <div class="mock-table-info">
      <span>📋 扫码点单 · 堂食</span>
      <span><strong>2</strong> 人 · 桌号 A06</span>
    </div>

    <div class="category-tabs">
      <span class="category-tab active">🍳 炒饭</span>
      <span class="category-tab highlight">🍝 炒面</span>
      <span class="category-tab">🥟 水饺</span>
      <span class="category-tab">🍜 汤面</span>
      <span class="category-tab">🥗 小菜</span>
      <span class="category-tab">🍲 馄饨</span>
    </div>

    <div class="menu-list" id="menuList"></div>

    <div class="cart-bar">
      <div class="cart-inner" id="cartBar">
        <div class="cart-info">
          <span class="cart-total" id="cartTotal">¥0</span>
          <span class="cart-count" id="cartCount">0</span>
        </div>
        <button class="cart-checkout" id="checkoutBtn">去结算</button>
      </div>
    </div>
  </div>

  <script>
    const menuData = [
      // ===== 炒饭类 =====
      { id: 1, name: '鸡蛋肉丝炒饭', desc: '香喷喷的家常味', price: 12, badge: '招牌' },
      { id: 2, name: '鸡蛋火腿炒饭', desc: '火腿丁+鸡蛋', price: 10, badge: '' },
      { id: 3, name: '老干妈炒饭', desc: '微辣 · 老干妈风味', price: 10, badge: '' },
      { id: 4, name: '鸡蛋炒饭', desc: '经典原味', price: 8, badge: '' },

      // ===== 炒面炒河粉类 =====
      { id: 5, name: '鸡蛋肉丝炒面', desc: '劲道面条+肉丝', price: 12, badge: '人气' },
      { id: 6, name: '鸡蛋火腿炒面', desc: '火腿+鸡蛋', price: 10, badge: '' },
      { id: 7, name: '鸡蛋炒面', desc: '经典炒面', price: 8, badge: '' },
      { id: 8, name: '鸡蛋肉丝炒河粉', desc: '爽滑河粉+肉丝', price: 12, badge: '' },
      { id: 9, name: '鸡蛋火腿炒河粉', desc: '河粉+火腿+鸡蛋', price: 10, badge: '' },
      { id: 10, name: '鸡蛋炒河粉', desc: '经典炒河粉', price: 8, badge: '' },

      // ===== 水饺类 =====
      { id: 11, name: '韭菜鸡蛋水饺', desc: '16只/12元 · 24只/15元 · 30只/15元', price: 12, badge: '' },
      { id: 12, name: '芹菜猪肉水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 13, name: '韭菜猪肉水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 14, name: '白菜猪肉水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 15, name: '大葱猪肉水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 16, name: '鲜肉水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 17, name: '什锦水饺', desc: '15只/10元 · 23只/15元 · 30只/20元', price: 10, badge: '' },
      { id: 18, name: '香菇猪肉水饺', desc: '15只/12元 · 20只/16元 · 25只/20元', price: 12, badge: '' },
      { id: 19, name: '荠菜猪肉水饺', desc: '15只/12元 · 20只/16元 · 25只/20元', price: 12, badge: '' },

      // ===== 汤面类 =====
      { id: 20, name: '青椒肉丝面', desc: '青椒+肉丝', price: 10, badge: '' },
      { id: 21, name: '雪菜肉丝面', desc: '雪菜+肉丝', price: 10, badge: '' },
      { id: 22, name: '番茄鸡蛋面', desc: '番茄+鸡蛋', price: 10, badge: '' },
      { id: 23, name: '葱油拌面', desc: '葱香四溢', price: 8, badge: '' },
      { id: 24, name: '鸡蛋面', desc: '清汤鸡蛋面', price: 7, badge: '' },

      // ===== 小菜/凉菜类 =====
      { id: 25, name: '花生米', desc: '酥脆下酒', price: 5, badge: '' },
      { id: 26, name: '凉拌黄瓜', desc: '清爽开胃', price: 10, badge: '' },
      { id: 27, name: '蒜香皮蛋', desc: '皮蛋+蒜蓉', price: 15, badge: '' },
      { id: 28, name: '皮蛋豆腐', desc: '嫩豆腐+皮蛋', price: 10, badge: '' },
      { id: 29, name: '荷包蛋', desc: '煎蛋', price: 2, badge: '' },

      // ===== 馄饨类 =====
      { id: 30, name: '大馄饨', desc: '12只/12元 · 15只/15元 · 20只/20元', price: 12, badge: '' },
      { id: 31, name: '小馄饨', desc: '小碗/5元 · 中碗/8元 · 大碗/10元', price: 5, badge: '' },

      // ===== 其他 =====
      { id: 32, name: '鸡腿饭+素菜', desc: '整只鸡腿+时蔬', price: 12, badge: '推荐' },
      { id: 33, name: '凉皮', desc: '小份/7元 · 大份/10元', price: 7, badge: '' },
      { id: 34, name: '凉面', desc: '小份/7元 · 大份/10元', price: 7, badge: '' },
      { id: 35, name: '冲鸡蛋汤', desc: '暖心暖胃', price: 2, badge: '' }
    ];

    let cart = {};
    const menuListEl = document.getElementById('menuList');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartCountEl = document.getElementById('cartCount');
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    function renderMenu() {
      let html = '';
      menuData.forEach(item => {
        const qty = cart[item.id] || 0;
        const badgeHtml = item.badge ? `<span class="badge">${item.badge}</span>` : '';
        html += `
          <div class="menu-item" data-id="${item.id}">
            <div class="item-info">
              <div class="item-name">${item.name} ${badgeHtml}</div>
              <div class="item-desc">${item.desc}</div>
              <div class="item-price">¥${item.price} <small>起</small></div>
            </div>
            <div class="item-actions">
              ${qty > 0 ? `<button class="qty-btn" data-action="decr" data-id="${item.id}">−</button>` : ''}
              ${qty > 0 ? `<span class="qty-number">${qty}</span>` : ''}
              <button class="qty-btn add" data-action="incr" data-id="${item.id}">+</button>
            </div>
          </div>
        `;
      });
      menuListEl.innerHTML = html;
      updateCartUI();
    }

    function updateCartUI() {
      let count = 0, price = 0;
      for (const id in cart) {
        const qty = cart[id];
        if (qty > 0) {
          count += qty;
          const item = menuData.find(d => d.id === Number(id));
          if (item) price += item.price * qty;
        }
      }
      cartTotalEl.textContent = '¥' + price.toFixed(0);
      cartCountEl.textContent = count;
    }

    menuListEl.addEventListener('click', function(e) {
      const target = e.target.closest('button');
      if (!target) return;
      const action = target.dataset.action;
      const id = Number(target.dataset.id);
      if (isNaN(id)) return;

      const item = menuData.find(d => d.id === id);
      if (!item) return;

      if (action === 'incr') {
        cart[id] = (cart[id] || 0) + 1;
        showToast(`+1 · ${item.name}`);
        renderMenu();
      } else if (action === 'decr') {
        if (cart[id] > 1) {
          cart[id]--;
          showToast(`-1 · ${item.name}`);
        } else {
          delete cart[id];
          showToast(`已移除 ${item.name}`);
        }
        renderMenu();
      }
    });

    document.getElementById('checkoutBtn').addEventListener('click', function() {
      const items = Object.keys(cart).filter(k => cart[k] > 0);
      if (items.length === 0) {
        showToast('🛒 购物车是空的');
        return;
      }
      let total = 0;
      let detail = items.map(id => {
        const item = menuData.find(d => d.id === Number(id));
        total += item.price * cart[id];
        return `${item.name} x${cart[id]}`;
      }).join('、');
      if (detail.length > 30) detail = detail.slice(0, 28) + '…';
      showToast(`✅ 已下单：${detail} (总计 ¥${total})`);
    });

    renderMenu();
    setTimeout(() => showToast('👋 欢迎！扫码点单，美味即达'), 400);
  </script>
</body>
</html>
